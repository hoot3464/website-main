<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Image Gallery</title>
    <script src="header.js"></script>
</head>

<body>
    <script src="gallery.js"></script>
    
    <div class="gallery">
        <br>
        <br>
        <h1 class="description" id="imageDescription" style="text-align: left; font-size: 2em;">Extreme G 64 Grimace: Double Trouble</h1>
        <img id="galleryImage" src="assets/grimace_double.jpg" alt="Extreme G 64">
        
        <div class="controls" style="text-align: left; margin-top: 20px;">
            <button style="font-size: 1.5em; padding: 10px 20px; margin: 0 10px; color: black;" onclick="prevImage()">Previous</button>
            <button style="font-size: 1.5em; padding: 10px 20px; margin: 0 10px; color: black;" onclick="nextImage()">Next</button>
        </div>
        
    </div>

</body>


<footer>
    <script src="footer.js"></script>
</footer>

</html>
